<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floraphone</title>
    <style>
      :root {
        --bg: #f7fbf4;
        --bg-soft: #eef7e8;
        --surface: #ffffff;
        --surface-2: #f6fff1;
        --text: #1e2a1f;
        --muted: #435646;
        --border: #b8cfb2;
        --accent: #2f7a45;
        --accent-strong: #205d34;
        --focus: #15471c;
        --status-good-bg: #e7f9ea;
        --status-good-text: #19572a;
        --status-bad-bg: #ffecea;
        --status-bad-text: #7b1f1f;
        --pixel-green-dark: #2e5935;
        --pixel-green-mid: #4f8b49;
        --pixel-green-light: #8eca78;
        --pixel-flower-pink: #ff8cc8;
        --pixel-flower-yellow: #ffd85c;
        --pixel-sky: #def4ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--pixel-sky) 0%, #edfbe4 40%, #d9f3c9 100%);
        color: var(--text);
        overflow-x: hidden;
      }

      body.pause-animations * {
        animation-play-state: paused !important;
      }

      .shell {
        position: relative;
        z-index: 3;
        max-width: 920px;
        margin: 24px auto 48px;
        padding: 0 20px;
        line-height: 1.55;
      }

      .hero {
        background: linear-gradient(135deg, var(--surface) 0%, var(--bg-soft) 100%);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(33, 86, 45, 0.08);
        backdrop-filter: blur(2px);
      }

      h1 {
        margin: 0 0 8px;
        letter-spacing: 0.3px;
      }

      p {
        margin: 0;
      }

      .subtitle {
        color: var(--muted);
        max-width: 68ch;
      }

      .controls {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      button {
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background-color 120ms ease, transform 120ms ease;
      }

      #capture-btn {
        font-size: 1.2rem;
        padding: 14px 22px;
      }

      .secondary-btn {
        background: #5e7363;
      }

      .secondary-btn:hover {
        background: #445a49;
      }

      button:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-top: 14px;
      }

      .preview-wrap {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.75);
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #photo-preview {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: none;
      }

      .preview-placeholder {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .grid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 1.15rem;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        min-height: 160px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status-neutral {
        background: #edf3f4;
        color: #274049;
      }

      .status-good {
        background: var(--status-good-bg);
        color: var(--status-good-text);
      }

      .status-bad {
        background: var(--status-bad-bg);
        color: var(--status-bad-text);
      }

      .small-note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .health-line {
        margin-top: 10px;
        font-size: 0.95rem;
        color: var(--muted);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      @media (max-width: 680px) {
        .shell {
          margin-top: 16px;
        }
      }

      .audio-controls {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .scene-layer {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .pixel-grass {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 140px;
        z-index: 1;
        background-image:
          linear-gradient(0deg, var(--pixel-green-dark) 0 14px, transparent 14px),
          linear-gradient(90deg, var(--pixel-green-mid) 0 20px, var(--pixel-green-light) 20px 40px);
        background-size: 100% 20px, 40px 40px;
        image-rendering: pixelated;
        animation: grassShift 9s linear infinite;
      }

      .flower-row {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 130px;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
      }

      .pixel-flower {
        width: 34px;
        height: 34px;
        position: relative;
        image-rendering: pixelated;
        animation: flowerBob 3s ease-in-out infinite;
      }

      .pixel-flower::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 22px;
        width: 6px;
        height: 72px;
        background:
          linear-gradient(var(--pixel-green-mid), var(--pixel-green-mid)),
          radial-gradient(ellipse at 20% 58%, #76bb69 0 7px, transparent 7px),
          radial-gradient(ellipse at 80% 66%, #5ca955 0 7px, transparent 7px),
          radial-gradient(ellipse at 18% 78%, #86c772 0 7px, transparent 7px);
        background-repeat: no-repeat;
        background-size: 6px 72px, 14px 10px, 14px 10px, 14px 10px;
        background-position: 0 0, -10px 28px, 2px 38px, -9px 52px;
      }

      .pixel-flower::after {
        content: "";
        position: absolute;
        width: 28px;
        height: 28px;
        left: 3px;
        top: 0;
        background:
          radial-gradient(circle, var(--pixel-flower-yellow) 0 6px, transparent 6px),
          radial-gradient(circle at 50% 0%, var(--pixel-flower-pink) 0 7px, transparent 7px),
          radial-gradient(circle at 0% 50%, var(--pixel-flower-pink) 0 7px, transparent 7px),
          radial-gradient(circle at 100% 50%, var(--pixel-flower-pink) 0 7px, transparent 7px),
          radial-gradient(circle at 50% 100%, var(--pixel-flower-pink) 0 7px, transparent 7px);
      }

      .pixel-flower.f2::after {
        background:
          radial-gradient(circle, #ffef85 0 6px, transparent 6px),
          radial-gradient(circle at 50% 0%, #ff9a62 0 7px, transparent 7px),
          radial-gradient(circle at 0% 50%, #ff9a62 0 7px, transparent 7px),
          radial-gradient(circle at 100% 50%, #ff9a62 0 7px, transparent 7px),
          radial-gradient(circle at 50% 100%, #ff9a62 0 7px, transparent 7px);
      }

      .pixel-flower.f3::after {
        background:
          radial-gradient(circle, #ffe48a 0 6px, transparent 6px),
          radial-gradient(circle at 50% 0%, #8db1ff 0 7px, transparent 7px),
          radial-gradient(circle at 0% 50%, #8db1ff 0 7px, transparent 7px),
          radial-gradient(circle at 100% 50%, #8db1ff 0 7px, transparent 7px),
          radial-gradient(circle at 50% 100%, #8db1ff 0 7px, transparent 7px);
      }

      .pixel-flower.f4::after {
        background:
          radial-gradient(circle, #fff19a 0 6px, transparent 6px),
          radial-gradient(circle at 50% 0%, #a88cff 0 7px, transparent 7px),
          radial-gradient(circle at 0% 50%, #a88cff 0 7px, transparent 7px),
          radial-gradient(circle at 100% 50%, #a88cff 0 7px, transparent 7px),
          radial-gradient(circle at 50% 100%, #a88cff 0 7px, transparent 7px);
      }

      .pixel-flower.tall::before {
        height: 96px;
        background-size: 6px 96px, 15px 10px, 15px 10px, 15px 10px;
        background-position: 0 0, -10px 36px, 2px 50px, -9px 70px;
      }

      .pixel-flower.medium::before {
        height: 84px;
        background-size: 6px 84px, 14px 10px, 14px 10px, 14px 10px;
        background-position: 0 0, -10px 32px, 2px 44px, -9px 62px;
      }

      .pixel-flower.short::before {
        height: 72px;
        background-size: 6px 72px, 14px 10px, 14px 10px, 14px 10px;
        background-position: 0 0, -10px 28px, 2px 38px, -9px 52px;
      }

      .pixel-butterfly,
      .pixel-bee {
        position: absolute;
        width: 26px;
        height: 20px;
        image-rendering: pixelated;
      }

      .pixel-butterfly {
        width: 40px;
        height: 30px;
        background:
          radial-gradient(circle at 28% 52%, #9a63ff 0 10px, transparent 10px),
          radial-gradient(circle at 72% 52%, #ff72c9 0 10px, transparent 10px),
          radial-gradient(circle at 28% 42%, #75d6ff 0 6px, transparent 6px),
          radial-gradient(circle at 72% 42%, #ffe57a 0 6px, transparent 6px),
          linear-gradient(#4a2f2f, #4a2f2f);
        background-size: 20px 20px, 20px 20px, 12px 12px, 12px 12px, 3px 26px;
        background-position: 1px 8px, 19px 8px, 5px 2px, 23px 2px, 18px 2px;
        background-repeat: no-repeat;
        animation: flutterFly 16s linear infinite;
      }

      .pixel-butterfly.b2 {
        top: 34%;
        animation-delay: -8s;
      }

      .pixel-bee {
        width: 24px;
        height: 16px;
        background:
          radial-gradient(circle at 30% 35%, #ffffff 0 4px, transparent 4px),
          radial-gradient(circle at 70% 35%, #d6efff 0 4px, transparent 4px),
          repeating-linear-gradient(90deg, #ffc933 0 5px, #3f2f16 5px 8px);
        border-radius: 10px;
        animation: beeBuzz 8s linear infinite;
      }

      .pixel-bee.b2 {
        top: 46%;
        animation-delay: -3.5s;
      }

      .pixel-cloud {
        position: absolute;
        width: 120px;
        height: 44px;
        border-radius: 28px;
        background:
          radial-gradient(circle at 22% 60%, rgba(255, 255, 255, 0.95) 0 20px, transparent 20px),
          radial-gradient(circle at 48% 42%, rgba(255, 255, 255, 0.97) 0 24px, transparent 24px),
          radial-gradient(circle at 74% 60%, rgba(255, 255, 255, 0.93) 0 19px, transparent 19px),
          linear-gradient(rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95));
        background-repeat: no-repeat;
        background-size: 44px 40px, 56px 44px, 42px 38px, 100px 26px;
        background-position: 2px 8px, 30px 0px, 72px 8px, 10px 14px;
        filter: drop-shadow(0 4px 4px rgba(69, 108, 139, 0.12));
        animation: cloudDrift 34s linear infinite;
      }

      .pixel-cloud.c2 {
        top: 15%;
        left: -170px;
        transform: scale(0.85);
        animation-duration: 42s;
        animation-delay: -15s;
      }

      .pixel-cloud.c3 {
        top: 23%;
        left: -190px;
        transform: scale(1.1);
        animation-duration: 50s;
        animation-delay: -6s;
      }

      .pixel-sun {
        position: absolute;
        top: 22px;
        left: 22px;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 35%, #fff7bd 0 14px, transparent 14px),
          radial-gradient(circle, #ffd157 0 22px, #ffb934 22px 30px, transparent 30px);
        box-shadow:
          0 0 0 6px rgba(255, 228, 130, 0.35),
          0 0 0 12px rgba(255, 228, 130, 0.16);
        animation: sunGlow 3.8s ease-in-out infinite;
      }

      .pixel-sun::before {
        content: "";
        position: absolute;
        inset: -10px;
        background:
          linear-gradient(#ffc040, #ffc040),
          linear-gradient(#ffc040, #ffc040),
          linear-gradient(#ffc040, #ffc040),
          linear-gradient(#ffc040, #ffc040);
        background-repeat: no-repeat;
        background-size: 4px 12px, 4px 12px, 12px 4px, 12px 4px;
        background-position: 50% 0, 50% 100%, 0 50%, 100% 50%;
      }

      @keyframes flowerBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }

      @keyframes grassShift {
        0% { background-position: 0 0, 0 0; }
        100% { background-position: 0 0, 80px 0; }
      }

      @keyframes flutterFly {
        0% { transform: translate(-5vw, 10vh) rotate(-4deg); }
        25% { transform: translate(25vw, 2vh) rotate(6deg); }
        50% { transform: translate(55vw, 14vh) rotate(-2deg); }
        75% { transform: translate(80vw, 5vh) rotate(4deg); }
        100% { transform: translate(110vw, 10vh) rotate(-3deg); }
      }

      @keyframes beeBuzz {
        0% { transform: translate(-5vw, 0) scale(1); }
        20% { transform: translate(18vw, 8px) scale(1.03); }
        45% { transform: translate(44vw, -6px) scale(1); }
        70% { transform: translate(70vw, 10px) scale(1.02); }
        100% { transform: translate(105vw, -2px) scale(1); }
      }

      @keyframes cloudDrift {
        0% { transform: translateX(0); }
        100% { transform: translateX(125vw); }
      }

      @keyframes sunGlow {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div class="scene-layer" aria-hidden="true">
      <div class="pixel-sun"></div>
      <div class="pixel-cloud" style="top:8%; left:-160px;"></div>
      <div class="pixel-cloud c2"></div>
      <div class="pixel-cloud c3"></div>
      <div class="pixel-butterfly" style="top:18%"></div>
      <div class="pixel-butterfly b2"></div>
      <div class="pixel-bee" style="top:28%"></div>
      <div class="pixel-bee b2"></div>
      <div class="flower-row">
        <div class="pixel-flower f2 tall" style="animation-delay:-0.8s"></div>
        <div class="pixel-flower f3 medium" style="animation-delay:-1.4s"></div>
        <div class="pixel-flower f4 tall" style="animation-delay:-2.1s"></div>
        <div class="pixel-flower f2 short" style="animation-delay:-0.4s"></div>
        <div class="pixel-flower f3 tall" style="animation-delay:-1.1s"></div>
        <div class="pixel-flower f4 medium" style="animation-delay:-2.4s"></div>
        <div class="pixel-flower f2 tall" style="animation-delay:-0.2s"></div>
        <div class="pixel-flower f3 short" style="animation-delay:-1.8s"></div>
        <div class="pixel-flower f4 tall" style="animation-delay:-2.8s"></div>
        <div class="pixel-flower f2 medium" style="animation-delay:-0.6s"></div>
        <div class="pixel-flower f3 tall" style="animation-delay:-1.6s"></div>
        <div class="pixel-flower f4 medium" style="animation-delay:-2.2s"></div>
      </div>
      <div class="pixel-grass"></div>
    </div>
    <main class="shell">
      <section class="hero">
        <h1>Floraphone</h1>
        <p class="subtitle">
          Capture a flower, hear a melody, and read a tactile-first description designed for accessible
          nature storytelling.
        </p>

        <div class="controls">
          <button id="capture-btn" type="button">Capture Flower</button>
          <input id="photo-input" type="file" accept="image/*" capture="environment" style="display:none" />
          <span class="status status-neutral" id="status" aria-live="polite">idle</span>
        </div>

        <p class="health-line" id="health-line" aria-live="polite">
          System health: checking...
        </p>
      </section>

      <div class="grid">
        <section class="card" aria-labelledby="desc-heading">
          <h2 id="desc-heading">Sensory Description</h2>
          <div class="preview-wrap">
            <img id="photo-preview" alt="Captured flower preview" />
            <span id="preview-placeholder" class="preview-placeholder">Captured flower will appear here</span>
          </div>
          <p id="desc" aria-live="polite">Waiting for first capture.</p>
          <div class="audio-controls">
            <button id="speak-btn" class="secondary-btn" type="button">Read Aloud</button>
            <button id="stop-speech-btn" class="secondary-btn" type="button">Stop Voice</button>
          </div>
        </section>

        <section class="card" aria-labelledby="json-heading">
          <h2 id="json-heading">Music JSON</h2>
          <pre id="json" aria-live="polite"></pre>
        </section>
      </div>
    </main>

    <div id="sr-updates" aria-live="polite" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">
    </div>

    <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
    <script>
      const button = document.getElementById("capture-btn");
      const photoInput = document.getElementById("photo-input");
      const photoPreview = document.getElementById("photo-preview");
      const previewPlaceholder = document.getElementById("preview-placeholder");
      const statusEl = document.getElementById("status");
      const healthLineEl = document.getElementById("health-line");
      const descEl = document.getElementById("desc");
      const speakBtn = document.getElementById("speak-btn");
      const stopSpeechBtn = document.getElementById("stop-speech-btn");
      const jsonEl = document.getElementById("json");
      const srUpdatesEl = document.getElementById("sr-updates");

      let synth;
      let speechEnabled = "speechSynthesis" in window;
      let activeUtterance = null;

      function setStatus(text, level = "neutral") {
        statusEl.textContent = text;
        statusEl.className = "status";
        if (level === "good") statusEl.classList.add("status-good");
        else if (level === "bad") statusEl.classList.add("status-bad");
        else statusEl.classList.add("status-neutral");
        srUpdatesEl.textContent = text;
      }

      function createSynth(articulation) {
        const envelope =
          articulation === "staccato"
            ? { attack: 0.01, decay: 0.08, sustain: 0.1, release: 0.05 }
            : { attack: 0.05, decay: 0.15, sustain: 0.6, release: 0.4 };

        if (synth) synth.dispose();
        synth = new Tone.Synth({
          oscillator: { type: "triangle" },
          envelope,
        }).toDestination();
      }

      function stopDescriptionSpeech() {
        if (!speechEnabled) return;
        window.speechSynthesis.cancel();
        activeUtterance = null;
      }

      function speakDescription(text) {
        if (!speechEnabled || !text || !text.trim()) return;
        stopDescriptionSpeech();
        const utterance = new SpeechSynthesisUtterance(text.trim());
        utterance.rate = 0.92;
        utterance.pitch = 1.0;
        utterance.onend = () => {
          activeUtterance = null;
        };
        activeUtterance = utterance;
        window.speechSynthesis.speak(utterance);
      }

      async function playMusic(music) {
        await Tone.start();
        Tone.Transport.stop();
        Tone.Transport.cancel();

        const tempo = Number(music.tempo || 70);
        Tone.Transport.bpm.value = tempo;
        createSynth(music.articulation || "legato");

        const notes = Array.isArray(music.notes) ? music.notes : [];
        const durations = Array.isArray(music.durations) ? music.durations : [];
        const beats = Array.isArray(music.beats) ? music.beats : [];
        let cursor = 0;

        for (let i = 0; i < notes.length; i += 1) {
          const note = notes[i];
          const dur = durations[i] || "4n";
          const time = Tone.Time(cursor).toSeconds();
          const len = Tone.Time(dur).toSeconds();
          Tone.Transport.schedule((t) => {
            synth.triggerAttackRelease(note, dur, t);
          }, time);
          cursor += len;
        }

        Tone.Transport.start("+0.05");

        if (navigator.vibrate && beats.length > 0) {
          beats.forEach((ms) => {
            window.setTimeout(() => {
              navigator.vibrate(45);
            }, Math.max(0, Number(ms) || 0));
          });
        }
      }

      async function refreshHealth() {
        try {
          const response = await fetch("/health");
          const health = await response.json();
          const provider = health?.provider?.provider || "unknown";
          const cameraReady = health?.camera_required
            ? (health?.camera?.ok ? "camera ready" : "camera not ready")
            : "mobile camera mode";
          const providerReady = health?.provider?.ok ? "provider ready" : "provider not ready";
          healthLineEl.textContent = `System health: ${provider} | ${providerReady} | ${cameraReady}`;
        } catch (err) {
          healthLineEl.textContent = "System health: unavailable";
        }
      }

      async function captureAndPlay(file) {
        setStatus("capturing...", "neutral");
        button.disabled = true;
        try {
          const formData = new FormData();
          formData.append("photo", file);
          const response = await fetch("/analyze-photo", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Analyze failed");
          const result = data.result || {};
          const captureId = result.capture_id || data.id;

          descEl.textContent = result.sensory_description || "";
          speakDescription(descEl.textContent);
          jsonEl.textContent = JSON.stringify(result.music || data.music, null, 2);
          setStatus(
            result.haptic?.forwarded ? "played + vibrated + sent to Pico" : "played + vibrated",
            result.haptic?.forwarded ? "good" : "neutral"
          );

          if (captureId) {
            try {
              await fetch(`/beats/${captureId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ beats: result.music?.beats || [] }),
              });
            } catch (_err) {
              // Non-fatal: local audio should still play even if haptic forward fails.
            }
          }

          await playMusic(result.music || data.music || {});
        } catch (err) {
          setStatus("error", "bad");
          descEl.textContent = err.message || "Unknown error";
        } finally {
          button.disabled = false;
        }
      }

      if (!speechEnabled) {
        speakBtn.disabled = true;
        stopSpeechBtn.disabled = true;
        setStatus("voice readout unavailable in this browser", "neutral");
      } else {
        speakBtn.addEventListener("click", () => {
          speakDescription(descEl.textContent || "");
        });
        stopSpeechBtn.addEventListener("click", stopDescriptionSpeech);
      }

      button.addEventListener("click", () => {
        photoInput.click();
      });

      photoInput.addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const localUrl = URL.createObjectURL(file);
        photoPreview.src = localUrl;
        photoPreview.style.display = "block";
        previewPlaceholder.style.display = "none";

        await captureAndPlay(file);
      });
      refreshHealth();
      setInterval(refreshHealth, 8000);
    </script>
